<!-- Paint the forest ink immediately so there is never a white flash before CSS loads -->
<style>
  html,body{background:#050e0a;margin:0}
  #boot{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 38%,#10412a,#07150e 55%,#030806)}
  #boot i{position:relative;width:54px;height:54px;border-radius:50%;border:3px solid #b9f0c8;box-shadow:0 0 60px 8px #8fdaa155;animation:bootpulse 2.2s ease-in-out infinite}
  #boot i::after{content:"";position:absolute;inset:-3px -3px -3px 6px;border-radius:50%;background:#030806}
  @keyframes bootpulse{50%{transform:scale(1.12);box-shadow:0 0 90px 16px #8fdaa177}}
  @media (prefers-reduced-motion:reduce){#boot i{animation:none}}
</style>
</head>
<body>
<div id="root"><div id="boot" aria-hidden="true"><i></i></div></div>
<noscript><p style="color:#b9f0c8;font:16px system-ui;padding:24px">Eclipsa needs JavaScript to run Django in your browser.</p></noscript>
<script type="module" src="/src/main.tsx"></script>
</body>
